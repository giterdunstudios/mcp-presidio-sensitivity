{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "presidio-worker.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "presidio-worker.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "presidio-worker.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # Allow inbound scan requests from the MCP server only.
    # All other ingress is denied by default.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mcp-presidio-sensitivity
      ports:
        - protocol: TCP
          port: 8080
{{- end }}

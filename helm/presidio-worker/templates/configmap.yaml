apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "presidio-worker.fullname" . }}-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "presidio-worker.labels" . | nindent 4 }}
data:
  MAX_PAYLOAD_BYTES: {{ .Values.config.maxPayloadBytes | int | quote }}
  DEFAULT_LANGUAGE: {{ .Values.config.defaultLanguage | quote }}
  POLICY_PROFILE: {{ .Values.config.policyProfile | quote }}
  MIN_SCORE_THRESHOLD: {{ .Values.config.minScoreThreshold | quote }}
  SERVICE_VERSION: {{ .Chart.AppVersion | quote }}
  ENVIRONMENT: {{ .Values.environment | default "production" | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.tracing.otlpEndpoint | quote }}

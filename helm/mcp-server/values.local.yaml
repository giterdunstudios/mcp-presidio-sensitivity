# ---------------------------------------------------------------------------
# MCP Server — Local override values (Docker Desktop / kind / WSL2)
#
# Usage:
#   helm upgrade --install mcp-presidio-sensitivity ./helm/mcp-presidio-sensitivity \
#     -f ./helm/mcp-presidio-sensitivity/values.yaml \
#     -f ./helm/mcp-presidio-sensitivity/values.local.yaml \
#     --namespace mcp-presidio --create-namespace
# ---------------------------------------------------------------------------

replicaCount: 1

image:
  repository: k3d-mcp-registry:5000/mcp-presidio-sensitivity
  tag: "0.1.0"
  # Pull from local k3d registry
  pullPolicy: Always

# Relaxed resource constraints for local development
resources:
  limits:
    memory: 384Mi
    cpu: 1000m
  requests:
    memory: 128Mi
    cpu: 100m

config:
  # In local dev, tokens are issued via localhost:8080 (kind host port mapping).
  # The iss claim therefore uses localhost, not the cluster-internal DNS name.
  # Override issuerUrl so PyJWT validates against the actual token issuer.
  issuerUrl: "http://localhost:8080/realms/mcp-local"

environment: local

networkPolicy:
  enabled: true

# NodePort — exposes the server on localhost:30800 via kind extraPortMappings
# (kind-config.yaml must include containerPort: 30800)
service:
  type: NodePort
  port: 8000
  nodePort: 30800

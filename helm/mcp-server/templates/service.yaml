apiVersion: v1
kind: Service
metadata:
  name: {{ include "mcp-presidio-sensitivity.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "mcp-presidio-sensitivity.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
      {{- if .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
  selector:
    {{- include "mcp-presidio-sensitivity.selectorLabels" . | nindent 4 }}

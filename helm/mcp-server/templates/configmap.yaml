apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mcp-presidio-sensitivity.fullname" . }}-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "mcp-presidio-sensitivity.labels" . | nindent 4 }}
data:
  OIDC_DISCOVERY_URL: {{ .Values.config.oidcDiscoveryUrl | quote }}
  ISSUER_URL: {{ .Values.config.issuerUrl | quote }}
  AUDIENCE: {{ .Values.config.audience | quote }}
  WORKER_URL: {{ .Values.config.workerUrl | quote }}
  JWKS_CACHE_TTL_SECONDS: {{ .Values.config.jwksCacheTtlSeconds | int | quote }}
  MAX_PAYLOAD_BYTES: {{ .Values.config.maxPayloadBytes | int | quote }}
  WORKER_TIMEOUT_SECONDS: {{ .Values.config.workerTimeoutSeconds | quote }}
  SERVER_RESOURCE_URL: {{ .Values.config.serverResourceUrl | quote }}
  PORT: {{ .Values.config.port | quote }}
  SERVICE_VERSION: {{ .Chart.AppVersion | quote }}
  ENVIRONMENT: {{ .Values.environment | default "production" | quote }}

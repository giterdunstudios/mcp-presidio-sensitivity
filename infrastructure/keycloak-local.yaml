---
# Keycloak — local dev deployment (kind cluster only)
#
# Uses Keycloak dev mode (start-dev) with embedded H2 database and realm
# import at startup.  Not suitable for production.
#
# Realm JSON is mounted from the keycloak-realm-import ConfigMap.
# ConfigMap is created by setup-local.sh from keycloak/realm-import/mcp-local-realm.json

apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: mcp-presidio
  labels:
    app: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      automountServiceAccountToken: false
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.1.4
          args: ["start-dev", "--import-realm"]
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: admin
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              value: change-me-in-prod
            - name: KC_HTTP_PORT
              value: "8080"
            - name: KC_HOSTNAME_STRICT
              value: "false"
            - name: KC_HOSTNAME_STRICT_HTTPS
              value: "false"
            - name: KC_HTTP_ENABLED
              value: "true"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: realm-import
              mountPath: /opt/keycloak/data/import
              readOnly: true
          resources:
            limits:
              memory: 768Mi
              cpu: 1000m
            requests:
              memory: 512Mi
              cpu: 200m
          readinessProbe:
            httpGet:
              # Check mcp-local realm specifically — only passes after --import-realm completes.
              # /realms/master becomes available earlier; using mcp-local ensures rollout status
              # waits for the correct signal before the smoke test fires.
              path: /realms/mcp-local
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 18
          livenessProbe:
            httpGet:
              path: /realms/master
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: realm-import
          configMap:
            name: keycloak-realm-import
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: mcp-presidio
  labels:
    app: keycloak
spec:
  type: NodePort
  selector:
    app: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
      nodePort: 30880

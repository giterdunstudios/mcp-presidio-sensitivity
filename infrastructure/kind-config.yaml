kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  extraPortMappings:
  # Keycloak HTTP endpoint (token issuance, JWKS, admin console)
  - containerPort: 30880
    hostPort: 8080
    protocol: TCP
  # Presidio worker
  - containerPort: 30890
    hostPort: 8090
    protocol: TCP
  # MCP server
  - containerPort: 30800
    hostPort: 8000
    protocol: TCP
  # Jaeger UI
  - containerPort: 31686
    hostPort: 16686
    protocol: TCP
  # Prometheus
  - containerPort: 31090
    hostPort: 9090
    protocol: TCP
  # Grafana
  - containerPort: 31300
    hostPort: 3000
    protocol: TCP

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  extraPortMappings:
  # Keycloak HTTP endpoint (token issuance, JWKS, admin console)
  - containerPort: 30880
    hostPort: 8080
    protocol: TCP
  # Presidio worker
  - containerPort: 30890
    hostPort: 8090
    protocol: TCP
  # MCP server
  - containerPort: 30800
    hostPort: 8000
    protocol: TCP

# Corpus: Secrets-Like Data
# Entity types covered: Credential patterns, API key patterns
# All values are clearly non-operational test strings.
# No real API keys, passwords, or tokens anywhere in this file.

- id: sec-001
  description: String matching sk-test- prefixed API key pattern
  payload: "OPENAI_API_KEY=sk-test-abcdefghijklmnopqrstuvwxyz1234567890ABCDEFG"
  expected_sensitivity_detected: true
  expected_categories:
    - secrets_like_data
  expected_severity_band: critical
  expected_decision: block
  notes: >
    sk-test- is a commonly known prefix format for OpenAI-style test API keys.
    The suffix is a synthetic random-looking string — not a real key.
    Presidio does not include a built-in API key recognizer for MVP;
    this case identifies a potential custom recognizer requirement.
    Mark as recognizer gap for Phase 1 custom recognizer work.

- id: sec-002
  description: Password appearing in a config-file-like context
  payload: |
    [database]
    host = db.internal.invalid.test
    port = 5432
    username = app_service_account
    password = S3cur3!T3stPassw0rd#2026
  expected_sensitivity_detected: true
  expected_categories:
    - secrets_like_data
  expected_severity_band: critical
  expected_decision: block
  notes: >
    Config file format with a password in plaintext.
    Password value is a synthetic credential — follows common complexity rules
    but is not in use anywhere.
    Presidio does not have a built-in PASSWORD recognizer; this is a custom
    recognizer gap. Pattern matching on key names like 'password =' would
    cover this case in a custom rule.

- id: sec-003
  description: Placeholder that looks like a secret but is a template variable
  payload: "Set your API key using the environment variable: YOUR_API_KEY_HERE"
  expected_sensitivity_detected: false
  expected_categories: []
  expected_severity_band: low
  expected_decision: allow
  notes: >
    YOUR_API_KEY_HERE is a documentation placeholder, not a real key.
    A well-tuned recognizer should suppress this match based on
    all-uppercase placeholder patterns. False positive risk is high
    for naive pattern matchers. This is an important negative case
    for any custom secrets recognizer.

- id: sec-004
  description: Base64-encoded string that is not a secret
  payload: >
    The system encodes diagnostic payloads as base64 for transport.
    Example output: SGVsbG8gV29ybGQgZnJvbSBTeW50aGV0aWMgVGVzdA==
  expected_sensitivity_detected: false
  expected_categories: []
  expected_severity_band: low
  expected_decision: allow
  notes: >
    SGVsbG8gV29ybGQgZnJvbSBTeW50aGV0aWMgVGVzdA== decodes to:
    "Hello World from Synthetic Test"
    Base64 encoding alone does not indicate a credential or secret.
    Naive base64 pattern matchers would produce false positives on any
    base64 content. This case tests suppression of non-secret encoded values.

- id: sec-005
  description: JWT-shaped token string in a log line
  payload: >
    2026-03-24T09:00:00Z DEBUG [auth] Received token:
    eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJ0ZXN0LXVzZXIiLCJpYXQiOjE3MDAwMDAwMDB9.SYNTHETIC_SIGNATURE_NOT_VALID
  expected_sensitivity_detected: true
  expected_categories:
    - secrets_like_data
  expected_severity_band: critical
  expected_decision: block
  notes: >
    The header and payload segments are real base64url-encoded JWT structure
    (sub: test-user) but the signature segment is replaced with
    SYNTHETIC_SIGNATURE_NOT_VALID — making this non-operational.
    JWT tokens appearing in logs represent a credential leak pattern.
    Custom recognizer needed for JWT format detection.
